<!DOCTYPE html>
<html lang="ja">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-WM30847696"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-WM30847696');
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ヨコ・コミュニケーション診断 | 青山学院大学 内田ゼミ</title>

    <style>
        :root { --bg: #fdfbf7; --text: #333; --accent: #2c3e50; --white: #ffffff; }
        body { font-family: sans-serif; background-color: var(--bg); display: flex; justify-content: center; align-items: center; min-height: 100vh; flex-direction: column; margin: 0; }
        .container { background: var(--white); width: 90%; max-width: 600px; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); text-align: center; }
        .hidden { display: none !important; }
        .btn-start, .btn-rating { background: var(--accent); color: #fff; padding: 15px 30px; border: none; border-radius: 50px; cursor: pointer; font-weight: bold; margin-top: 10px; width: 100%; }
        .btn-rating { background: #fff; color: #333; border: 2px solid #eee; margin-bottom: 10px; }
        .question-text { font-size: 1.2rem; font-weight: bold; margin: 30px 0; }
        .progress-bar-container { width: 100%; height: 8px; background: #eee; border-radius: 4px; margin-bottom: 20px; }
        .progress-bar { height: 100%; background: var(--accent); width: 0%; transition: 0.3s; border-radius: 4px; }
    </style>
</head>
<body>

    <div class="container">
        <div id="start-screen">
            <h1>ヨコ・コミュニケーション診断</h1>
            <p>退職後の「孤独リスク」に備えるヒントを探ります。</p>
            <button class="btn-start" onclick="startDiagnosis()">診断を始める</button>
        </div>

        <div id="quiz-screen" class="hidden">
            <div class="progress-bar-container"><div id="progress-fill" class="progress-bar"></div></div>
            <div id="question-text" class="question-text">質問がここに表示されます</div>
            <div class="rating-options">
                <button class="btn-rating" onclick="answer(5)">5. 当てはまる</button>
                <button class="btn-rating" onclick="answer(4)">4. やや当てはまる</button>
                <button class="btn-rating" onclick="answer(3)">3. どちらともいえない</button>
                <button class="btn-rating" onclick="answer(2)">2. あまり当てはまらない</button>
                <button class="btn-rating" onclick="answer(1)">1. 当てはまらない</button>
            </div>
        </div>

        <div id="result-screen" class="hidden">
            <h2>診断結果</h2>
            <div id="result-name" style="font-size: 24px; font-weight: bold;"></div>
            <p id="result-desc"></p>
            <button class="btn-start" onclick="location.reload()">もう一度やる</button>
        </div>
    </div>

    <script>
        // 質問データ
        const questions = [
            { text: "1. 他の人が単調だと思う作業でも、黙々とこなすことができる", type: "green" },
            { text: "2. 具体的な指示があるまで、余計な行動はとらない", type: "green" }
            // 本番ではここに30問入れてください
        ];

        // 結果データ
        const typeInfo = {
            green: { name: "【緑】マイペース派", desc: "穏やかな性格です。" },
            blue: { name: "【青】論理派", desc: "知的なタイプです。" }
            // 他のタイプも同様に追加
        };

        let currentIdx = 0;
        let scores = { green: 0, blue: 0, red: 0, yellow: 0, orange: 0, brown: 0 };

        // ★ボタンを押した時に動く関数
        function startDiagnosis() {
            console.log("診断スタート！"); // デバッグ用
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');
            showQuestion();
        }

        function showQuestion() {
            if (currentIdx < questions.length) {
                document.getElementById('question-text').innerText = questions[currentIdx].text;
                document.getElementById('progress-fill').style.width = (currentIdx / questions.length) * 100 + "%";
            }
        }

        function answer(point) {
            const type = questions[currentIdx].type;
            scores[type] += point;
            currentIdx++;

            if (currentIdx < questions.length) {
                showQuestion();
            } else {
                showResult();
            }
        }

        function showResult() {
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');
            
            // スコア集計ロジック（簡易版）
            let resultType = 'green'; 
            document.getElementById('result-name').innerText = typeInfo[resultType].name;
            document.getElementById('result-desc').innerText = typeInfo[resultType].desc;
        }
    </script>
</body>
</html>
